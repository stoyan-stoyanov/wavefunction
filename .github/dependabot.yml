# Security updates (switched on in the repository settings) open a pull request as soon as an
# advisory affects a locked version. Routine version updates are off: open-pull-requests-limit: 0
# stops them without touching security updates, which have their own limit. The groups, cooldown
# and major-version rules below stay, so removing the limits switches version updates back on.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /website
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      website:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: uv
    directory: /backend
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      backend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /src-tauri
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      desktop:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
