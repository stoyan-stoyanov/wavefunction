name: Linux from scratch
# Before a release, and on changes to these checks: build the app on a bare Ubuntu 24.04 by
# following README's Linux section word for word, then check each Linux feature in the built app
# under a virtual display (scripts/linux-from-scratch.sh and scripts/verify-linux-desktop.py), on
# x86-64 and arm64. Each run keeps screenshots and a recording of the desktop. Not in all-checks.
on:
  workflow_dispatch:
    inputs:
      build:
        description: Reuse the packages of this earlier run (its ID) and only run the desktop checks
        required: false
  pull_request:
    paths:
      - .github/workflows/linux-from-scratch.yml
      - scripts/linux-from-scratch.sh
      - scripts/verify-linux-desktop.py
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: ${{ !inputs.build }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Privileged so that bwrap can make namespaces in the container and the AppImage can mount.
      - name: README's steps 1 to 3 on a bare Ubuntu 24.04, then the built engine's checks
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          docker run --rm --privileged -v "$GITHUB_WORKSPACE:/source:ro" -v "$RUNNER_TEMP/build:/out" \
            ubuntu:24.04 /source/scripts/linux-from-scratch.sh build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.runner }}
          path: ${{ runner.temp }}/build
          retention-days: 7
  desktop:
    needs: build
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.runner }}
          path: ${{ runner.temp }}/build
          run-id: ${{ inputs.build || github.run_id }}
          github-token: ${{ github.token }}
      - name: README's step 4 on another bare Ubuntu 24.04, then the desktop checks
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          docker run --rm --privileged -v "$GITHUB_WORKSPACE:/source:ro" -v "$RUNNER_TEMP/build:/build:ro" \
            -v "$RUNNER_TEMP/evidence:/out" ubuntu:24.04 /source/scripts/linux-from-scratch.sh desktop
      - name: Results
        if: ${{ !cancelled() }}
        run: cat "$RUNNER_TEMP/evidence/results.txt" >> "$GITHUB_STEP_SUMMARY" || true
      # Computer use runs its desktop in Docker, which the bare system above has no engine for.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        if: ${{ !cancelled() }}
      - name: Computer use against this runner's Docker Engine
        if: ${{ !cancelled() }}
        run: |
          uv sync --locked --project backend --python 3.12 --extra dev
          uv run --no-sync --project backend python scripts/verify-computer.py --build \
            --evidence "$RUNNER_TEMP/evidence/computer.png"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: evidence-${{ matrix.runner }}
          path: ${{ runner.temp }}/evidence
          retention-days: 14
