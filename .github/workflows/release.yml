name: Release
# A version tag (v0.2.0) builds the signed, notarized app and opens a draft GitHub Release with
# the DMG, ZIP, updater archive and latest.json. Publishing the draft is what ships it: the
# website's download link and installed apps' update checks both read the latest release.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
jobs:
  macos:
    # Pinned, not macos-latest: a Mac app runs on newer macOS but not older, and what builds a
    # release shouldn't change without a commit. `native` in checks.yml uses the same image.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TAG: ${{ github.ref_name }}
    # No dependency caches: this job holds the signing keys, so it installs from the lockfiles on a
    # clean runner rather than restoring files another run wrote.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          # setup-node v5+ caches npm by default once package.json names npm as its packageManager.
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # setup-uv caches by default on GitHub-hosted runners.
          enable-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Tag matches the app version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match version $version"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: node scripts/changelog.mjs "${TAG#v}" > "$RUNNER_TEMP/notes.md"
      - run: uv sync --locked --project backend --python 3.12 --extra dev
      - run: npm --prefix frontend ci --no-audit --no-fund
      - name: Import the Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
          [ -n "$identity" ] || { echo "No Developer ID Application identity in APPLE_CERTIFICATE"; exit 1; }
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Write the notarization key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          printf '%s' "$APPLE_API_KEY" > "$RUNNER_TEMP/notarization.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notarization.p8" >> "$GITHUB_ENV"
      - run: npm run sidecar:build
      - run: ./frontend/node_modules/.bin/tauri build --ci --bundles app --config src-tauri/tauri.conf.json
      - name: Collect third-party notices and sources
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          backend/.venv/bin/python scripts/release-notices.py
      - name: Sign, notarize and package
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release-desktop.mjs
      - name: Draft the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --draft --title "Wavefunction ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag dist/release/*
      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notarization.p8"
  # Experimental x86-64 Linux downloads, unsigned except for the AppImage's updater signature. This
  # job never touches the macos job or its files: attach-linux adds what it builds to the draft only
  # once both jobs passed, so a Linux failure leaves the Mac release exactly as it would be without it.
  linux:
    # Not newer: the app and engine need at least the glibc of the system that built them.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # Read-only: its files reach the release through attach-linux.
    permissions:
      contents: read
    env:
      # uv's own Python 3.12, which carries the shared libpython PyInstaller bundles.
      UV_PYTHON_PREFERENCE: only-managed
      # Tauri's AppImage tools are AppImages themselves, and the runner has no FUSE to mount them.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    # No dependency caches, as in the macos job: a release installs from the lockfiles.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The deb-src entries let release-notices.py download the bundled libraries' source packages.
      - name: Bubblewrap, Tauri's system libraries and their sources
        run: |
          sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/deb-src.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: uv sync --locked --project backend --python 3.12 --extra dev
      - run: npm --prefix frontend ci --no-audit --no-fund
      # Before the build, unlike on macOS: a .deb or AppImage can't take files added after Tauri
      # bundles it, so the notices go in as a resource. Only here, not in tauri.linux.conf.json,
      # which would make every Linux build run this first.
      - name: Collect third-party notices and sources
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu
          backend/.venv/bin/python scripts/release-notices.py x86_64-unknown-linux-gnu
      - run: npm run sidecar:build
      - run: ./frontend/node_modules/.bin/tauri build --ci --config '{"bundle":{"resources":{"../dist/legal/notices":"legal"}}}'
      - run: node scripts/package-desktop.mjs
      - name: The packaged engine starts, answers /health and passes its sandbox self-check
        run: |
          dpkg-deb -x dist/desktop/*.deb "$RUNNER_TEMP/app"
          engine=$(find "$RUNNER_TEMP/app" -path '*/backend/wavefunction-backend' -type f)
          "$engine" --port 8799 --token ci-token --data-dir "$RUNNER_TEMP/data" & engine_pid=$!
          trap 'kill $engine_pid' EXIT
          for _ in $(seq 90); do curl -fsS http://127.0.0.1:8799/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8799/health
          curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:8799/api/grants | jq -e '.sandbox_ok'
      - name: Both packages carry the notices
        working-directory: ${{ runner.temp }}
        run: |
          find app -path '*/legal/inventory.json' | grep -q .
          "$GITHUB_WORKSPACE"/dist/desktop/*.AppImage --appimage-extract > /dev/null
          find squashfs-root -path '*/legal/inventory.json' | grep -q .
      - name: Release files and SHA256SUMS-linux
        run: |
          stem=$(node -p "const c = require('./src-tauri/tauri.conf.json'); c.productName + '-' + c.version + '-linux-x86_64'")
          mkdir -p dist/release-linux
          cp dist/desktop/*.AppImage "dist/release-linux/$stem.AppImage"
          cp dist/desktop/*.deb "dist/release-linux/$stem.deb"
          (cd dist && zip -qr "release-linux/$stem-notices-and-sources.zip" legal)
          (cd dist/release-linux && sha256sum -- * > SHA256SUMS-linux && cat SHA256SUMS-linux)
      # The AppImage people download is also what installed AppImages update to: the updater writes
      # it over the running one. Signed with the macos job's updater key, which only this step sees,
      # after SHA256SUMS-linux, which lists no .sig, as SHA256SUMS doesn't. attach-linux puts the
      # signature in latest.json.
      - name: Sign the AppImage for the updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          ./frontend/node_modules/.bin/tauri signer sign --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
            dist/release-linux/*.AppImage
          ls dist/release-linux/*.AppImage.sig
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: dist/release-linux/
          if-no-files-found: error
  # Adds the Linux files to the draft the macos job created, only when both builds passed. After a
  # Linux failure, rerunning the failed jobs retries this without rebuilding the Mac release.
  attach-linux:
    needs: [macos, linux]
    if: needs.macos.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-release
          path: linux-release
      - run: gh release upload "$TAG" --clobber linux-release/*
      # Installed AppImages update from the same latest.json as the Mac app, under `linux-x86_64`.
      # Only that key is added, and the job fails unless everything else, the darwin-aarch64 entry
      # above all, reads back exactly as the macos job wrote it, so the Mac feed can't change here.
      - name: Add the AppImage to latest.json, leaving the Mac entries as they are
        run: |
          gh release download "$TAG" --pattern latest.json --dir feed
          appimage=$(basename linux-release/*.AppImage)
          jq --arg signature "$(cat "linux-release/$appimage.sig")" \
            --arg url "https://github.com/$GH_REPO/releases/download/$TAG/$appimage" \
            '.platforms["linux-x86_64"] = {signature: $signature, url: $url}' feed/latest.json > latest.json
          jq -ce '.platforms["darwin-aarch64"]' feed/latest.json > darwin-before.json
          jq -ce '.platforms["darwin-aarch64"]' latest.json > darwin-after.json
          cmp darwin-before.json darwin-after.json
          cmp <(jq -S 'del(.platforms["linux-x86_64"])' feed/latest.json) \
            <(jq -S 'del(.platforms["linux-x86_64"])' latest.json)
          jq '.platforms | keys' latest.json
          gh release upload "$TAG" --clobber latest.json
