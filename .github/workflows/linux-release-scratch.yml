name: Linux release scratch
# Temporary: runs release.yml's linux job on this branch, never releases. Removed before review.
on:
  push:
    branches: [claude/exciting-khorana-2f015b]
permissions:
  contents: read
jobs:
  linux:
    # Not newer: the app and engine need at least the glibc of the system that built them.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # Read-only: its files reach the release through attach-linux.
    permissions:
      contents: read
    env:
      # uv's own Python 3.12, which carries the shared libpython PyInstaller bundles.
      UV_PYTHON_PREFERENCE: only-managed
      # Tauri's AppImage tools are AppImages themselves, and the runner has no FUSE to mount them.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    # No dependency caches, as in the macos job: a release installs from the lockfiles.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # The deb-src entries let release-notices.py download the bundled libraries' source packages.
      - name: Bubblewrap, Tauri's system libraries and their sources
        run: |
          sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/deb-src.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: uv sync --locked --project backend --python 3.12 --extra dev
      - run: npm --prefix frontend ci --no-audit --no-fund
      # Before the build, unlike on macOS: a .deb or AppImage can't take files added after Tauri
      # bundles it, so the notices go in as a resource. Only here, not in tauri.linux.conf.json,
      # which would make every Linux build run this first.
      - name: Collect third-party notices and sources
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target x86_64-unknown-linux-gnu
          backend/.venv/bin/python scripts/release-notices.py x86_64-unknown-linux-gnu
      - run: npm run sidecar:build
      - run: ./frontend/node_modules/.bin/tauri build --ci --config '{"bundle":{"resources":{"../dist/legal/notices":"legal"}}}'
      - run: node scripts/package-desktop.mjs
      - name: The packaged engine starts, answers /health and passes its sandbox self-check
        run: |
          dpkg-deb -x dist/desktop/*.deb "$RUNNER_TEMP/app"
          engine=$(find "$RUNNER_TEMP/app" -path '*/backend/wavefunction-backend' -type f)
          "$engine" --port 8799 --token ci-token --data-dir "$RUNNER_TEMP/data" & engine_pid=$!
          trap 'kill $engine_pid' EXIT
          for _ in $(seq 90); do curl -fsS http://127.0.0.1:8799/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8799/health
          curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:8799/api/grants | jq -e '.sandbox_ok'
      - name: Both packages carry the notices
        working-directory: ${{ runner.temp }}
        run: |
          find app -path '*/legal/inventory.json' | grep -q .
          "$GITHUB_WORKSPACE"/dist/desktop/*.AppImage --appimage-extract > /dev/null
          find squashfs-root -path '*/legal/inventory.json' | grep -q .
      - name: Release files and SHA256SUMS-linux
        run: |
          stem=$(node -p "const c = require('./src-tauri/tauri.conf.json'); c.productName + '-' + c.version + '-linux-x86_64'")
          mkdir -p dist/release-linux
          cp dist/desktop/*.AppImage "dist/release-linux/$stem.AppImage"
          cp dist/desktop/*.deb "dist/release-linux/$stem.deb"
          (cd dist && zip -qr "release-linux/$stem-notices-and-sources.zip" legal)
          (cd dist/release-linux && sha256sum -- * > SHA256SUMS-linux && cat SHA256SUMS-linux)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-release
          path: dist/release-linux/
          if-no-files-found: error
      # Scratch-only inspection, not in release.yml.
      - name: Inspect the packages
        if: always()
        run: |
          set -x
          ls -la dist/release-linux || true
          deb=$(ls dist/release-linux/*.deb)
          dpkg-deb -f "$deb" Package Version Depends
          dpkg-deb -c "$deb" | grep -E 'usr/bin/|legal/(inventory.json|LICENSE|THIRD_PARTY)' | head
          dpkg-deb -c "$deb" | grep -c '/legal/' || true
          jq '[.[] | select(.group == "linux")]' dist/legal/notices/inventory.json
          ls -la dist/legal/notices/linux/*/ || true
          ls dist/legal/sources | grep -vE '\.(crate|tar\.gz|zip)$' || true
          du -sh dist/legal dist/legal/sources
          cd "$RUNNER_TEMP/squashfs-root"
          find . -path '*/legal/inventory.json'
          for b in usr/bin/*; do echo "$b needs $(objdump -T "$b" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"; done
          echo "Bundled shared libraries and the packages they come from:"
          find . -name '*.so*' -type f | sed 's|.*/||' | sort -u > "$RUNNER_TEMP/libs.txt"
          wc -l < "$RUNNER_TEMP/libs.txt"
          while read -r lib; do dpkg-query -S "*/$lib" 2>/dev/null | head -1 | cut -d: -f1 || echo "?? $lib"; done < "$RUNNER_TEMP/libs.txt" | sort | uniq -c | sort -rn
  attach-dry-run:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-release
          path: linux-release
      - run: ls -la linux-release && cd linux-release && sha256sum -c SHA256SUMS-linux
  install-on-24-04:
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-release
          path: linux-release
      - name: Install the .deb as a user would
        run: |
          sudo apt-get update
          sudo apt-get install -y ./linux-release/*.deb xvfb imagemagick
          dpkg -s bubblewrap xdg-utils | grep -E '^(Package|Status)'
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: The installed engine answers /health and passes its sandbox self-check
        run: |
          engine=$(dpkg -L "$(dpkg-deb -f linux-release/*.deb Package)" | grep '/backend/wavefunction-backend$')
          "$engine" --port 8799 --token ci-token --data-dir "$RUNNER_TEMP/data" & engine_pid=$!
          trap 'kill $engine_pid' EXIT
          for _ in $(seq 90); do curl -fsS http://127.0.0.1:8799/health && break; sleep 1; done
          curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:8799/api/grants | jq -e '.sandbox_ok'
      - name: The installed app and the AppImage open a window
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          Xvfb :99 -screen 0 1600x1000x24 & export DISPLAY=:99; sleep 2
          app=$(dpkg -L "$(dpkg-deb -f linux-release/*.deb Package)" | grep '^/usr/bin/')
          "$app" > deb.log 2>&1 & pid=$!; sleep 30
          kill -0 $pid && echo "deb app still running after 30s"; import -window root deb.png; kill $pid || true; sleep 3
          pkill -f wavefunction-backend || true
          chmod +x linux-release/*.AppImage
          ./linux-release/*.AppImage > appimage.log 2>&1 & pid=$!; sleep 40
          kill -0 $pid && echo "AppImage still running after 40s"; import -window root appimage.png; kill $pid || true
          tail -20 deb.log appimage.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: "*.png"
