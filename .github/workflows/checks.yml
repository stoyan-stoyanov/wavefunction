name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request replaces its running checks. On main a running check finishes;
  # GitHub still keeps only the newest waiting one when several merges queue up behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Whether a pull request changes more than docs. The macOS jobs, about ten times the cost of a
  # Linux one, skip docs-only changes. `app` says whether it can change the built macOS app beyond
  # what the test suites see: the shell, packaging, freezing the engine, and the platform modules.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      app: ${{ steps.classify.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then printf 'code=true\napp=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qvE '\.md$|^docs/|^assets/|^website/'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          app_paths='^src-tauri/|^backend/wavefunction-backend\.spec$|^backend/(pyproject\.toml|uv\.lock)$'
          app_paths+='|^backend/src/wavefunction/(platforms|sandbox|sandbox_linux|fileops|main|__main__)\.py$'
          app_paths+='|^frontend/src/lib/platform\.ts$|^frontend/package(-lock)?\.json$|^\.github/workflows/'
          app_paths+='|^scripts/(build-sidecar|release-desktop|release-notices|package-desktop|backend-links|macos-manifest)\.'
          app_paths+='|^scripts/verify-(release|native|coding-features)\.py$'
          if echo "$changed" | grep -qE "$app_paths"; then app=true; else app=false; fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The code-health ratchet compares this commit with its first parent.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - name: API types match backend/openapi.json (npm run generate:api)
        run: |
          npm run generate:api:types
          git diff --exit-code -- frontend/src/lib/api.gen.ts || { echo "::error::frontend/src/lib/api.gen.ts is stale. Run npm run generate:api and commit the result."; exit 1; }
      - run: npm --prefix frontend run lint
      - name: Formatting (run npm run fix to fix)
        run: npm --prefix frontend run format:check
      - name: Code health of changed TypeScript (npm run check:health)
        run: node scripts/check-code-health.mjs --lang ts --base HEAD^1
      - name: Script syntax
        run: for script in scripts/*.mjs; do node --check "$script"; done
      - name: Docs links and agent file sizes
        run: node scripts/check-docs.mjs
      - name: Platform differences stay in the platform modules
        run: node scripts/check-platform.mjs
      - run: npm run test:frontend
      # The build includes tsc; running a separate typecheck duplicates that work.
      - run: npm run build
      - name: Nothing left changed (commit what the job generated, or ignore it)
        run: git status --porcelain && test -z "$(git status --porcelain)"
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The type-check ratchet compares this commit with its first parent.
          fetch-depth: 2
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --project backend --python 3.12 --extra dev
      - run: uv run --no-sync --project backend ruff check backend
      - run: uv run --no-sync --project backend ruff check --config backend/pyproject.toml scripts
      - name: Formatting (run npm run fix to fix)
        run: |
          uv run --no-sync --project backend ruff format --check backend
          uv run --no-sync --project backend ruff format --check --config backend/pyproject.toml scripts
      - name: Code health of changed Python (npm run check:health)
        run: node scripts/check-code-health.mjs --lang py --base HEAD^1
      - name: Type-check changed backend files (npm run typecheck:backend)
        run: npm run typecheck:backend -- --base HEAD^1
      - name: OpenAPI schema is current (npm run generate:api)
        run: |
          uv run --no-sync --project backend python scripts/generate-openapi.py
          git diff --exit-code -- backend/openapi.json || { echo "::error::backend/openapi.json is stale. Run npm run generate:api and commit the result."; exit 1; }
      # The `linux` job runs the cases marked `sandbox` on Linux; this one stays macOS-and-Linux-neutral.
      - run: npm run test:backend
        env:
          WAVEFUNCTION_SANDBOX_TESTS: "0"
      - name: Nothing left changed (commit what the job generated, or ignore it)
        run: git status --porcelain && test -z "$(git status --porcelain)"
  # Cases marked `sandbox`, and the launcher integration, whose fixture chat runs in a repository,
  # run commands through the macOS sandbox, which Linux lacks. The newest macOS, because that's what
  # users run and the sandbox can change between versions.
  backend-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --project backend --python 3.12 --extra dev
      - run: npm run test:backend
      # Tests that run real deletion commands in temporary repositories run here only, never locally.
      - name: Destructive tests
        working-directory: backend
        run: uv run --no-sync pytest -n 2 --dist loadfile -m "destructive and not live"
      # Only the launcher integration needs browser dependencies. Install after Python checks.
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm run test:launcher
  # The desktop shell. It bundles the frozen backend, which compiling and testing it never runs,
  # so an empty stand-in takes its place. The same macOS as release.yml, so this compiles with the
  # toolchain that builds the app.
  native:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Formatting (run npm run fix to fix)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: mkdir -p backend/dist/wavefunction-backend
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
  # The macOS app, built as release.yml builds it but signed ad hoc, then checked where no other job
  # looks: the frozen engine in its sandbox, the signed release files, the bundle against
  # src-tauri/macos-bundle.txt (so Linux work can't change the Mac app unseen), and the app launching.
  # On main and for pull requests that can change the app (`changes`); required when it runs.
  macos-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: npm run setup
      - name: Freeze the engine
        run: npm run sidecar:build
      - name: The frozen engine passes its sandbox self-check and runs a scripted coding session
        run: backend/.venv/bin/python scripts/verify-coding-features.py --backend backend/dist/wavefunction-backend/wavefunction-backend
      - name: Build the app
        run: ./frontend/node_modules/.bin/tauri build --ci --bundles app --config src-tauri/tauri.conf.json
      - name: Collect third-party notices
        run: |
          cargo fetch --locked --manifest-path src-tauri/Cargo.toml --target aarch64-apple-darwin
          backend/.venv/bin/python scripts/release-notices.py
      - name: Sign ad hoc and package, with a throwaway updater key
        run: |
          ./frontend/node_modules/.bin/tauri signer generate --ci --password "" --write-keys "$RUNNER_TEMP/updater.key"
          node scripts/release-desktop.mjs
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY_PATH: ${{ runner.temp }}/updater.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
      - name: The release files hold together
        run: backend/.venv/bin/python scripts/verify-release.py dist/release --ad-hoc --pubkey "$RUNNER_TEMP/updater.key.pub"
      - name: The app matches src-tauri/macos-bundle.txt
        run: node scripts/macos-manifest.mjs --check
      - name: The app launches, serves its engine, edits, runs commands and restarts
        run: backend/.venv/bin/python scripts/verify-native.py
  # Linux, built from source and community-supported (SECURITY.md): the Bubblewrap and seccomp
  # sandbox with its escape tests, then the frozen engine and the desktop app built and started.
  # Not in all-checks, so a red Linux build never blocks a change.
  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # uv's own Python 3.12, which carries the shared libpython PyInstaller bundles. A system 3.12
      # may lack it (Ubuntu ships it separately), and newer Ubuntus have no 3.12 at all.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Bubblewrap, Tauri's system libraries and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb
      # Ubuntu's AppArmor (23.10 and later) refuses unprivileged user namespaces, which bwrap needs,
      # unless a profile allows them. README's Linux section tells users the same.
      - name: Let bwrap create user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm run setup
      - name: Sandbox tests, the Linux escape tests among them
        working-directory: backend
        run: uv run --no-sync pytest -n 4 --dist loadfile -m "sandbox and not live and not destructive"
      # Marked destructive with the rest of its file, but this case only classifies command text.
      - name: Commands that can't be undone are caught
        working-directory: backend
        run: uv run --no-sync pytest -m destructive tests/test_sandbox.py -k test_commands_that_cannot_be_undone
      - name: The desktop app (engine, then .deb and AppImage)
        run: npm run desktop:build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: The packaged engine starts, answers /health and passes its sandbox self-check
        run: |
          dpkg-deb -x dist/desktop/*.deb "$RUNNER_TEMP/app"
          engine=$(find "$RUNNER_TEMP/app" -path '*/backend/wavefunction-backend' -type f)
          "$engine" --port 8799 --token ci-token --data-dir "$RUNNER_TEMP/data" & engine_pid=$!
          trap 'kill $engine_pid' EXIT
          for _ in $(seq 90); do curl -fsS http://127.0.0.1:8799/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8799/health
          curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:8799/api/grants | jq -e '.sandbox_ok'
      - name: The AppImage opens its window and starts its engine
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          xvfb-run -a dist/desktop/*.AppImage > "$RUNNER_TEMP/appimage.log" 2>&1 & launcher=$!
          trap 'pkill -f -- "--parent-pid" || true; kill $launcher 2>/dev/null || true' EXIT
          for _ in $(seq 90); do
            engine=$(ps -ax -o args= | grep -- '--parent-pid' | grep -- '--port' | grep -v grep | head -1)
            [ -n "$engine" ] && break; sleep 1
          done
          [ -n "$engine" ] || { cat "$RUNNER_TEMP/appimage.log"; exit 1; }
          port=$(echo "$engine" | grep -oE -- '--port [0-9]+' | cut -d' ' -f2)
          for _ in $(seq 60); do curl -fsS "http://127.0.0.1:$port/health" && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/appimage.log"; exit 1
      # `native` lints and tests the shell on macOS only, so its Linux code is checked here.
      - name: The shell's Linux code passes clippy and its tests
        run: |
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
  # The one check to require in branch protection: it passes only when every job passed or was
  # skipped. Any other result fails it, including "abandoned", which a job gets when GitHub never
  # finds it a runner and so runs none of its steps.
  all-checks:
    if: always()
    needs: [changes, frontend, backend, backend-macos, native, macos-app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")' > /dev/null
