name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request replaces its running checks. On main a running check finishes;
  # GitHub still keeps only the newest waiting one when several merges queue up behind it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Whether a pull request changes more than docs. The macOS jobs, about ten times the cost of a
  # Linux one, skip docs-only changes.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          echo "$changed"
          if echo "$changed" | grep -qvE '\.md$|^docs/|^assets/|^website/'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The code-health ratchet compares this commit with its first parent.
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-audit --no-fund
      - name: API types match backend/openapi.json (npm run generate:api)
        run: |
          npm run generate:api:types
          git diff --exit-code -- frontend/src/lib/api.gen.ts || { echo "::error::frontend/src/lib/api.gen.ts is stale. Run npm run generate:api and commit the result."; exit 1; }
      - run: npm --prefix frontend run lint
      - name: Formatting (run npm run fix to fix)
        run: npm --prefix frontend run format:check
      - name: Code health of changed TypeScript (npm run check:health)
        run: node scripts/check-code-health.mjs --lang ts --base HEAD^1
      - name: Script syntax
        run: for script in scripts/*.mjs; do node --check "$script"; done
      - name: Docs links and agent file sizes
        run: node scripts/check-docs.mjs
      - run: npm run test:frontend
      # The build includes tsc; running a separate typecheck duplicates that work.
      - run: npm run build
      - name: Nothing left changed (commit what the job generated, or ignore it)
        run: git status --porcelain && test -z "$(git status --porcelain)"
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The type-check ratchet compares this commit with its first parent.
          fetch-depth: 2
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --project backend --python 3.12 --extra dev
      - run: uv run --no-sync --project backend ruff check backend
      - run: uv run --no-sync --project backend ruff check --config backend/pyproject.toml scripts
      - name: Formatting (run npm run fix to fix)
        run: |
          uv run --no-sync --project backend ruff format --check backend
          uv run --no-sync --project backend ruff format --check --config backend/pyproject.toml scripts
      - name: Code health of changed Python (npm run check:health)
        run: node scripts/check-code-health.mjs --lang py --base HEAD^1
      - name: Type-check changed backend files (npm run typecheck:backend)
        run: npm run typecheck:backend -- --base HEAD^1
      - name: OpenAPI schema is current (npm run generate:api)
        run: |
          uv run --no-sync --project backend python scripts/generate-openapi.py
          git diff --exit-code -- backend/openapi.json || { echo "::error::backend/openapi.json is stale. Run npm run generate:api and commit the result."; exit 1; }
      # The `linux` job runs the cases marked `sandbox` on Linux; this one stays macOS-and-Linux-neutral.
      - run: npm run test:backend
        env:
          WAVEFUNCTION_SANDBOX_TESTS: "0"
      - name: Nothing left changed (commit what the job generated, or ignore it)
        run: git status --porcelain && test -z "$(git status --porcelain)"
  # Cases marked `sandbox`, and the launcher integration, whose fixture chat runs in a repository,
  # run commands through the macOS sandbox, which Linux lacks. The newest macOS, because that's what
  # users run and the sandbox can change between versions.
  backend-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --project backend --python 3.12 --extra dev
      - run: npm run test:backend
      # Tests that run real deletion commands in temporary repositories run here only, never locally.
      - name: Destructive tests
        working-directory: backend
        run: uv run --no-sync pytest -n 2 --dist loadfile -m "destructive and not live"
      # Only the launcher integration needs browser dependencies. Install after Python checks.
      - run: npm --prefix frontend ci --no-audit --no-fund
      - run: npm run test:launcher
  # The desktop shell. It bundles the frozen backend, which compiling and testing it never runs,
  # so an empty stand-in takes its place. The same macOS as release.yml, so this compiles with the
  # toolchain that builds the app.
  native:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Formatting (run npm run fix to fix)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: mkdir -p backend/dist/wavefunction-backend
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
  # Linux, built from source and community-supported (SECURITY.md): the Bubblewrap and seccomp
  # sandbox with its escape tests, then the frozen engine and the desktop app built and started.
  # Not in all-checks, so a red Linux build never blocks a change.
  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # uv's own Python 3.12, which carries the shared libpython PyInstaller bundles. A system 3.12
      # may lack it (Ubuntu ships it separately), and newer Ubuntus have no 3.12 at all.
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Bubblewrap and Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # Ubuntu's AppArmor (23.10 and later) refuses unprivileged user namespaces, which bwrap needs,
      # unless a profile allows them. README's Linux section tells users the same.
      - name: Let bwrap create user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: npm run setup
      - name: Sandbox tests, the Linux escape tests among them
        working-directory: backend
        run: uv run --no-sync pytest -n 4 --dist loadfile -m "sandbox and not live and not destructive"
      - name: The desktop app (engine, then .deb and AppImage)
        run: npm run desktop:build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: The packaged engine starts, answers /health and passes its sandbox self-check
        run: |
          dpkg-deb -x dist/desktop/*.deb "$RUNNER_TEMP/app"
          engine=$(find "$RUNNER_TEMP/app" -path '*/backend/wavefunction-backend' -type f)
          "$engine" --port 8799 --token ci-token --data-dir "$RUNNER_TEMP/data" & engine_pid=$!
          trap 'kill $engine_pid' EXIT
          for _ in $(seq 90); do curl -fsS http://127.0.0.1:8799/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8799/health
          curl -fsS -H "Authorization: Bearer ci-token" http://127.0.0.1:8799/api/grants | jq -e '.sandbox_ok'
  # The one check to require in branch protection: it passes only when every job passed or was
  # skipped. Any other result fails it, including "abandoned", which a job gets when GitHub never
  # finds it a runner and so runs none of its steps.
  all-checks:
    if: always()
    needs: [changes, frontend, backend, backend-macos, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | jq -e 'all(. == "success" or . == "skipped")' > /dev/null
