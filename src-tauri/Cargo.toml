[package]
name = "wavefunction"
version = "0.1.1"
description = "Local-first desktop coding agent"
authors = ["Wavefunction contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "wavefunction_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
# macOS TLS rather than rustls: rustls would require every reqwest client in the app to install a crypto provider.
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["native-tls", "zip"] }

[target."cfg(target_os = \"macos\")".dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSColor", "NSControl", "NSGraphics", "NSView", "NSVisualEffectView", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation", "block2"] }

# A smaller shell: the app is mostly waiting on the WebView and the backend, not running Rust.
# Panics keep unwinding, as Tauri's command handlers and plugins expect.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
